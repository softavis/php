name: Build and publish PHP images

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: softavis/php

jobs:
  build:
    name: PHP ${{ matrix.php-version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        arch: ['amd64', 'arm64']
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for PR checks
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: PHP_VERSION=${{ matrix.php-version }}
          push: false
          load: true
          tags: local/php:${{ matrix.php-version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=php-${{ matrix.php-version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php-version }}-${{ matrix.arch }}

      - name: Build and push image by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: PHP_VERSION=${{ matrix.php-version }}
          outputs: type=image,name=${{ env.DOCKERHUB_REPOSITORY }},name-canonical=true,push-by-digest=true,push=true
          cache-from: type=gha,scope=php-${{ matrix.php-version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php-version }}-${{ matrix.arch }}

      - name: Smoke test image on current architecture
        env:
          TEST_IMAGE: ${{ github.event_name == 'pull_request' && format('local/php:{0}-{1}', matrix.php-version, matrix.arch) || format('{0}@{1}', env.DOCKERHUB_REPOSITORY, steps.build.outputs.digest) }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker pull "${TEST_IMAGE}"
          fi

          docker run --rm "${TEST_IMAGE}" php -v
          docker run --rm "${TEST_IMAGE}" composer --version
          docker run --rm "${TEST_IMAGE}" node --version
          docker run --rm "${TEST_IMAGE}" npm --version
          docker run --rm "${TEST_IMAGE}" symfony version
          docker run --rm "${TEST_IMAGE}" laravel --version

          extensions="bcmath curl intl mbstring pcntl pdo_mysql pdo_pgsql pdo_sqlite redis sockets zip"
          for ext in ${extensions}; do
            docker run --rm "${TEST_IMAGE}" php -m | tr '[:upper:]' '[:lower:]' | grep -Fx "${ext}" >/dev/null
          done

      - name: Export digest for manifest assembly
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo "${{ steps.build.outputs.digest }}" > "/tmp/${{ matrix.php-version }}-${{ matrix.arch }}.txt"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.php-version }}-${{ matrix.arch }}
          path: /tmp/${{ matrix.php-version }}-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish-manifests:
    name: Publish multi-platform manifests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and publish manifests
        run: |
          set -euo pipefail
          versions="7.3 7.4 8.0 8.1 8.2 8.3 8.4 8.5"

          for version in ${versions}; do
            amd64_digest="$(cat "/tmp/digests/${version}-amd64.txt")"
            arm64_digest="$(cat "/tmp/digests/${version}-arm64.txt")"

            docker buildx imagetools create \
              -t "${DOCKERHUB_REPOSITORY}:${version}" \
              -t "${DOCKERHUB_REPOSITORY}:${version}-${GITHUB_SHA}" \
              "${DOCKERHUB_REPOSITORY}@${amd64_digest}" \
              "${DOCKERHUB_REPOSITORY}@${arm64_digest}"
          done
