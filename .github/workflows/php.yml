name: Build and publish PHP images

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: softavis/php

jobs:
  build:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: PHP_VERSION=${{ matrix.php-version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_REPOSITORY }}:${{ matrix.php-version }}
            ${{ env.DOCKERHUB_REPOSITORY }}:${{ matrix.php-version }}-${{ github.sha }}
          cache-from: type=gha,scope=php-${{ matrix.php-version }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php-version }}
